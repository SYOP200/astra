name: Homebrew Formula Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  brew-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          stable: true

      - name: Tap the Astra Shell Homebrew formula
        run: |
          brew untap syop200/astra-shell 2>/dev/null || true
          brew tap syop200/astra-shell https://github.com/SYOP200/homebrew-astra-shell

      - name: Install Astra from tap
        run: |
          brew install --build-from-source syop200/astra-shell/astra-shell

      - name: Verify Astra runtime
        run: |
          astra --version
          astra theme list
