name: Homebrew Formula Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  brew-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          stable: true

      - name: Create temporary tap and install formula
        env:
          TAP_NAME: "$GITHUB_ACTOR/astra-shell-tap"
        run: |
          # Create a temporary tap for this run
          brew tap-new "$TAP_NAME"

          # Copy the local formula into the tap's Formula/ directory
          TAP_REPO=$(brew --repo "$TAP_NAME")
          mkdir -p "$TAP_REPO/Formula"
          cp ./astra-shell.rb "$TAP_REPO/Formula/astra-shell.rb"

          # Install the formula from the tap (builds from source)
          brew install --build-from-source "$TAP_NAME/astra-shell"

      - name: Verify Astra runtime
        run: |
          astra --version
          astra theme list
