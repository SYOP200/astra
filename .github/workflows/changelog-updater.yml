name: Changelog Updater

on:
  release:
    types: [published] # Triggers on new releases
  schedule:
    - cron: '0 3 * * 1' # Triggers every Monday at 3:00 AM UTC
  workflow_dispatch: # Triggers manually from the Actions tab

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Append changes to the bottom of CHANGELOG.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Initialize file with a base header if it is completely empty
        if [ ! -s CHANGELOG.md ]; then
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
        fi

        # Fetch latest release data. --fail=false prevents the 404 crash if no releases exist yet
        RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/latest --fail=false)

        # Parse data safely
        if [ -z "$RELEASE_DATA" ]; then
          RELEASE_NAME="v0.0.0"
          FULL_DESC="Initial repository tracking started."
        else
          RELEASE_NAME=$(echo "$RELEASE_DATA" | jq -r '.name // .tag_name')
          FULL_DESC=$(echo "$RELEASE_DATA" | jq -r '.body // "No description provided."')
          
          # Secondary safety fallback if jq outputs null strings
          if [ "$RELEASE_NAME" = "null" ] || [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="v0.0.0"
            FULL_DESC="Initial repository tracking started."
          fi
        fi

        # Isolate the first 4 words for the subtitle header
        FOUR_WORDS=$(echo "$FULL_DESC" | tr -d '*#`_-' | awk '{print $1,$2,$3,$4}')

        # Check if this release version is already documented in the CHANGELOG
        if grep -q "## $RELEASE_NAME" CHANGELOG.md; then
          echo "Release $RELEASE_NAME already exists in CHANGELOG.md. Skipping entry creation."
        else
          # Append the structured release block to the bottom of the file
          echo "" >> CHANGELOG.md
          echo "## $RELEASE_NAME - $FOUR_WORDS" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$FULL_DESC" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md

          # Track that changes were actually made
          echo "CHANGES_MADE=true" >> $GITHUB_ENV
        fi

    - name: Commit and push changes
      if: env.CHANGES_MADE == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add CHANGELOG.md
        git commit -m "docs: append latest release to changelog [skip ci]"
        git push
