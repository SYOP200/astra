name: Multi-Trigger Changelog Updater

on:
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Append changes to the bottom of CHANGELOG.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ ! -s CHANGELOG.md ]; then
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
        fi

        # We append '|| true' to stop the 404 from crashing the whole workflow run
        RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/latest 2>/dev/null || true)

        # Parse data safely if it's completely empty or if the API returned an error message
        if [ -z "$RELEASE_DATA" ] || echo "$RELEASE_DATA" | jq -e '.message' >/dev/null 2>&1; then
          RELEASE_NAME="v0.0.0"
          FULL_DESC="Initial repository tracking started."
        else
          RELEASE_NAME=$(echo "$RELEASE_DATA" | jq -r '.name // .tag_name')
          FULL_DESC=$(echo "$RELEASE_DATA" | jq -r '.body // "No description provided."')
          
          if [ "$RELEASE_NAME" = "null" ] || [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="v0.0.0"
            FULL_DESC="Initial repository tracking started."
          fi
        fi

        FOUR_WORDS=$(echo "$FULL_DESC" | tr -d '*#`_-' | awk '{print $1,$2,$3,$4}')

        if grep -q "## $RELEASE_NAME" CHANGELOG.md; then
          echo "Release $RELEASE_NAME already exists in CHANGELOG.md. Skipping entry creation."
        else
          echo "" >> CHANGELOG.md
          echo "## $RELEASE_NAME - $FOUR_WORDS" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$FULL_DESC" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md

          echo "CHANGES_MADE=true" >> $GITHUB_ENV
        fi

    - name: Commit and push changes
      if: env.CHANGES_MADE == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -m "docs: append latest release to changelog [skip ci]"
        git push
