name: Changelog Updater

on:
  release:
    types: [published]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Append changes to the bottom of CHANGELOG.md
      run: |
        # Initialize file with a base header if it is completely empty
        if [ ! -s CHANGELOG.md ]; then
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
        fi

        # Extract event variables
        RELEASE_NAME="${{ github.event.release.name }}"
        FULL_DESC="${{ github.event.release.body }}"

        if [ -z "$RELEASE_NAME" ]; then
          RELEASE_NAME="${{ github.event.release.tag_name }}"
        fi

        # Isolate the first 4 words for the subtitle header
        FOUR_WORDS=$(echo "$FULL_DESC" | tr -d '*#`_-' | awk '{print $1,$2,$3,$4}')

        # Append the structured release block to the bottom of the file
        echo "" >> CHANGELOG.md
        echo "## $RELEASE_NAME - $FOUR_WORDS" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "$FULL_DESC" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "---" >> CHANGELOG.md

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add CHANGELOG.md
        git commit -m "docs: append ${{ github.event.release.tag_name }} to changelog [skip ci]" || echo "No changes"
        git push
