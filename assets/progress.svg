<svg xmlns="http://w3.org" viewBox="0 0 450 40" width="450" height="40">
  <style>
    .retro-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      fill: #00ff00;
      font-weight: bold;
    }
    .pulsing-bar {
      fill: #00ff00;
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
  <rect width="450" height="40" fill="#000000" rx="4" stroke="#333333" stroke-width="2"/>
  
  <text x="15" y="25" class="retro-text pulsing-bar">[█████████</text>
  
  <text x="105" y="25" class="retro-text" fill="#333333">░░░░░░░░░░░] <tspan fill="#00ff00">45%</tspan></text>
</svg>
