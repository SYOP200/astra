[package]
name = "astra"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
nix = "0.31"
libc = "0.2"

crossterm = "0.29"
rustyline = "18"

git2 = "0.21"

serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"

chrono = "0.4"
whoami = "1"
hostname = "0.4"
